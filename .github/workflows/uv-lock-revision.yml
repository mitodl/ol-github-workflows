# This repository's own adoption of workflow-templates/uv-lock-revision.yml.
#
# It calls the action by self-repository ref rather than by the pinned external ref the template
# carries, so every pull request here exercises the action as the branch defines it. A pinned ref
# would test whatever is already on main and let a broken change merge green.
name: uv.lock revision
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: uv-lock-revision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  uv-lock-revision:
    name: uv.lock revision # the required-check context; keep it stable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: $/actions/uv-lock-revision
        with:
          expected-revision: "3"
