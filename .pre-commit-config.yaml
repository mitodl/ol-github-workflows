---
# Run with prek: `uv sync` then `uv run prek run --all-files`.
# workflow-templates/ holds workflow files outside .github/, so the workflow linters are pointed at it too.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        files: ^(\.github/workflows|workflow-templates)/.*\.ya?ml$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --min-severity=low, --min-confidence=low]
        files: ^(\.github/workflows|workflow-templates)/.*\.ya?ml$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
